! Sample Hardened Cisco Switch Configuration
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
service tcp-keepalives-in
!
hostname sw-core-01.corp
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username admin privilege 15 secret 5 $1$AbCd$1234567890abcdef
!
ip domain-name corp.internal
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
!
ip routing
!
vlan 10
 name USERS_DATA
vlan 20
 name VOIP_TELEPHONY
vlan 30
 name SERVERS_DMZ
vlan 99
 name NATIVE_MANAGEMENT
!
interface GigabitEthernet0/1
 description Trunk to Aggregation
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport mode trunk
!
interface GigabitEthernet0/2
 description Access to Workstation
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
!
banner motd ^C
========================================================================
  AUTHORIZED ACCESS ONLY. ALL SESSIONS MONITORED AND RECORDED.
  UNAUTHORIZED ACCESS IS PROHIBITED AND SUBJECT TO LEGAL PROSECUTION.
========================================================================
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login authentication default
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 login authentication default
line vty 5 15
 transport input none
!
ntp server 192.168.10.254
logging host 192.168.10.250
logging trap warnings
!
end
